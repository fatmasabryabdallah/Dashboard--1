<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeLevel — Master Frontend Development with interactive quizzes, coding challenges, and a Duolingo-style learning path. From zero to hero in HTML, CSS, JavaScript, React and more.">
  <meta name="keywords" content="frontend, quiz, HTML, CSS, JavaScript, React, learn to code, programming assessment, coding challenge, web development">
  <meta name="author" content="CodeLevel">
  <meta name="theme-color" content="#0F0F23">

  <title>CodeLevel — Master Frontend Development</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <!-- App Root -->
  <div id="app" class="app-container">
    <!-- Loading state -->
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px;">
      <div class="loading-spinner"></div>
      <p style="color: var(--text-secondary); font-size: var(--fs-sm);">Loading CodeLevel...</p>
    </div>
  </div>

  <!-- Scripts (order matters) -->
  <!-- Utilities -->
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/store.js"></script>
  <script src="js/utils/i18n.js"></script>

  <!-- Data -->
  <script src="js/data/roadmap.js"></script>
  <script src="js/data/internet-questions.js"></script>
  <script src="js/data/html-questions.js"></script>
  <script src="js/data/css-questions.js"></script>

  <!-- Monaco Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script>
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
  </script>

  <!-- Components -->
  <script src="js/components/quiz-engine.js"></script>

  <!-- Main App -->
  <script src="js/app.js"></script>
</body>
</html>
